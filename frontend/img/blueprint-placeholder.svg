<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Шаблон чертежа из каталога">
  <!-- Классическая «синька»: тёмно-синий фон, белая графика -->
  <defs>
    <pattern id="gridSmall" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="gridLarge" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#gridSmall)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#16437e"/>
  <rect width="1200" height="800" fill="url(#gridLarge)"/>

  <!-- Рамка листа -->
  <rect x="28" y="28" width="1144" height="744" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5"/>
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>

  <g stroke="#ffffff" fill="none" stroke-width="2">
    <!-- Вид спереди: рабочее колесо осевого вентилятора -->
    <g transform="translate(340,370)">
      <circle r="230" stroke-opacity="0.9"/>
      <circle r="218" stroke-opacity="0.35" stroke-dasharray="10 6"/>
      <circle r="56" stroke-opacity="0.9"/>
      <circle r="16" stroke-opacity="0.9"/>
      <!-- Лопасти -->
      <g stroke-opacity="0.85">
        <path d="M 0 -56 C 60 -120 60 -190 20 -216 C -10 -170 -30 -110 0 -56 Z" transform="rotate(0)"/>
        <path d="M 0 -56 C 60 -120 60 -190 20 -216 C -10 -170 -30 -110 0 -56 Z" transform="rotate(60)"/>
        <path d="M 0 -56 C 60 -120 60 -190 20 -216 C -10 -170 -30 -110 0 -56 Z" transform="rotate(120)"/>
        <path d="M 0 -56 C 60 -120 60 -190 20 -216 C -10 -170 -30 -110 0 -56 Z" transform="rotate(180)"/>
        <path d="M 0 -56 C 60 -120 60 -190 20 -216 C -10 -170 -30 -110 0 -56 Z" transform="rotate(240)"/>
        <path d="M 0 -56 C 60 -120 60 -190 20 -216 C -10 -170 -30 -110 0 -56 Z" transform="rotate(300)"/>
      </g>
      <!-- Осевые линии -->
      <g stroke-opacity="0.5" stroke-width="1" stroke-dasharray="18 6 4 6">
        <line x1="-260" y1="0" x2="260" y2="0"/>
        <line x1="0" y1="-260" x2="0" y2="260"/>
      </g>
      <!-- Отверстия фланца -->
      <g stroke-opacity="0.7" stroke-width="1.5">
        <circle cx="0" cy="-243" r="7"/>
        <circle cx="172" cy="-172" r="7"/>
        <circle cx="243" cy="0" r="7"/>
        <circle cx="172" cy="172" r="7"/>
        <circle cx="0" cy="243" r="7"/>
        <circle cx="-172" cy="172" r="7"/>
        <circle cx="-243" cy="0" r="7"/>
        <circle cx="-172" cy="-172" r="7"/>
      </g>
    </g>

    <!-- Вид сбоку: обечайка с фланцами и двигателем -->
    <g transform="translate(790,370)">
      <rect x="0" y="-230" width="230" height="460" stroke-opacity="0.9"/>
      <line x1="0" y1="-230" x2="-18" y2="-230" stroke-opacity="0.9"/>
      <line x1="0" y1="230" x2="-18" y2="230" stroke-opacity="0.9"/>
      <rect x="-18" y="-244" width="18" height="14" stroke-opacity="0.9"/>
      <rect x="-18" y="230" width="18" height="14" stroke-opacity="0.9"/>
      <rect x="230" y="-244" width="18" height="14" stroke-opacity="0.9"/>
      <rect x="230" y="230" width="18" height="14" stroke-opacity="0.9"/>
      <!-- Двигатель -->
      <rect x="62" y="-64" width="128" height="128" rx="10" stroke-opacity="0.85"/>
      <line x1="30" y1="0" x2="62" y2="0" stroke-opacity="0.85"/>
      <g stroke-opacity="0.5" stroke-width="1" stroke-dasharray="18 6 4 6">
        <line x1="-50" y1="0" x2="290" y2="0"/>
      </g>
      <!-- Стойки -->
      <line x1="126" y1="64" x2="126" y2="226" stroke-opacity="0.6"/>
      <line x1="126" y1="-64" x2="126" y2="-226" stroke-opacity="0.6"/>
    </g>

    <!-- Размерные линии -->
    <g stroke-opacity="0.7" stroke-width="1.2">
      <line x1="340" y1="660" x2="340" y2="690"/>
      <line x1="110" y1="660" x2="110" y2="690"/>
      <line x1="110" y1="678" x2="340" y2="678"/>
      <path d="M 118 674 L 110 678 L 118 682" fill="none"/>
      <path d="M 332 674 L 340 678 L 332 682" fill="none"/>

      <line x1="772" y1="140" x2="742" y2="140"/>
      <line x1="772" y1="600" x2="742" y2="600"/>
      <line x1="754" y1="140" x2="754" y2="600"/>
      <path d="M 750 148 L 754 140 L 758 148" fill="none"/>
      <path d="M 750 592 L 754 600 L 758 592" fill="none"/>
    </g>
  </g>

  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif">
    <text x="225" y="700" font-size="20" fill-opacity="0.85" text-anchor="middle">⌀D</text>
    <text x="738" y="376" font-size="20" fill-opacity="0.85" text-anchor="end">H</text>
    <text x="340" y="96" font-size="22" fill-opacity="0.9" text-anchor="middle" letter-spacing="2">ВИД СПЕРЕДИ</text>
    <text x="905" y="96" font-size="22" fill-opacity="0.9" text-anchor="middle" letter-spacing="2">ВИД СБОКУ</text>
  </g>

  <!-- Угловой штамп -->
  <g>
    <rect x="716" y="668" width="456" height="104" fill="#16437e" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
    <line x1="716" y1="704" x2="1172" y2="704" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="716" y1="738" x2="1172" y2="738" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="960" y1="668" x2="960" y2="772" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
    <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15">
      <text x="728" y="692" fill-opacity="0.9">VENTSEARCH</text>
      <text x="972" y="692" fill-opacity="0.7">Лист 1</text>
      <text x="728" y="726" fill-opacity="0.7">Чертёж из каталога</text>
      <text x="972" y="726" fill-opacity="0.7">Масштаб —</text>
      <text x="728" y="762" fill-opacity="0.7">Заглушка (шаблон)</text>
      <text x="972" y="762" fill-opacity="0.7">photos/blueprint_*.png</text>
    </g>
  </g>

  <!-- Водяная надпись-заглушка (слева от штампа, чтобы не пересекаться) -->
  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="372" y="742" font-size="15" fill-opacity="0.6" letter-spacing="1">МЕСТО ДЛЯ ЧЕРТЕЖА ИЗ КАТАЛОГА</text>
    <text x="372" y="764" font-size="14" fill-opacity="0.5">замените файлом photos/blueprint_&lt;модель&gt;.png</text>
  </g>
</svg>
