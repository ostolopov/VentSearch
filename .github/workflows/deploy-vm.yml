name: Deploy to YC VM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# ============================================================================
# Как это работает:
#
# 1. secrets/ папка ВРУЧНУЮ скопирована на сервер один раз:
#      scp -r secrets/ user@server:~/apps/ventsearch/secrets/
#    В ней находится secrets/.env.prod с реальными паролями и ключами.
#    Папка НЕ хранится в git и НЕ передаётся через CI.
#
# 2. GitHub Actions деплоит только код (без секретов).
#    deploy/compose.prod.yml читает ../secrets/.env.prod из файловой системы сервера.
#
# 3. Необходимые GitHub Secrets (Settings → Secrets → Actions):
#    VM_HOST     — IP или hostname сервера
#    VM_USER     — пользователь SSH (например: ubuntu)
#    VM_SSH_KEY  — приватный SSH-ключ (PEM, всё содержимое)
#    VM_SSH_PORT — SSH-порт (по умолчанию 22, опционально)
# ============================================================================

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy application code to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          # secrets/ НЕ включена: она уже на сервере
          source: "deploy/**,backend/**,frontend/**,data/**,photos/**"
          target: "~/apps/ventsearch"
          overwrite: true
          rm: false
          strip_components: 0

      - name: Run deploy on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -eu
            APP_DIR="$HOME/apps/ventsearch"
            SECRETS_FILE="$APP_DIR/secrets/.env.prod"

            cd "$APP_DIR"

            # Проверяем наличие секретов
            if [ ! -f "$SECRETS_FILE" ]; then
              echo "ОШИБКА: файл $SECRETS_FILE не найден!"
              echo "Скопируйте папку secrets/ на сервер вручную:"
              echo "  scp -r secrets/ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:$APP_DIR/secrets/"
              exit 1
            fi

            # Запуск через compose (файл в deploy/, secrets на уровень выше)
            docker compose -f deploy/compose.prod.yml --env-file "$SECRETS_FILE" up -d --build

            # Healthcheck
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then
                echo "Healthcheck OK"
                exit 0
              fi
              echo "Ожидание запуска приложения... ($i/20)"
              sleep 3
            done

            echo "Healthcheck не прошёл — смотрите логи:"
            docker compose -f deploy/compose.prod.yml ps
            docker compose -f deploy/compose.prod.yml logs --tail=100
            exit 1
